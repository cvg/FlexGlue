name: ONNX export

# Export the ONNX models on CPU and check them against the PyTorch
# implementation: dense features, matches, match and covisibility scores, and
# the predicted points and confidences of all keypoints. The float16 matcher
# needs a CUDA GPU and is not covered here.

on:
  push:
    branches: [main]
    paths:
      - "flexglue/**"
      - "onnx/**"
      - "tests/test_early_stop*.py"
      - "tests/test_onnx*.py"
      - "tests/onnx_test_utils.py"
      - "requirements.txt"
      - ".github/workflows/onnx_export.yml"
  pull_request:
    paths:
      - "flexglue/**"
      - "onnx/**"
      - "tests/test_early_stop*.py"
      - "tests/test_onnx*.py"
      - "tests/onnx_test_utils.py"
      - "requirements.txt"
      - ".github/workflows/onnx_export.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        ort: ["1.30.0", "1.31.1"]
    runs-on: ${{ matrix.os }}
    env:
      ORT_DISABLE_TELEMETRY: "1"
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch; the export and its check depend on these versions.
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy opencv-python-headless \
            onnx==1.23.2 onnxscript==0.7.2 onnxruntime==${{ matrix.ort }}
          python -m pip install --no-deps -e .

      - name: Check early-stop and input contracts
        run: |
          python -m unittest discover -s tests -p 'test_early_stop*.py' -v
          python -m unittest discover -s tests -p 'test_onnx*.py' -v

      - name: Cache the weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: flexglue-weights-v0.1

      - name: Export the descriptor and float32 matcher
        run: python onnx/export.py --output_dir "$RUNNER_TEMP/flexglue_onnx"

      - name: Check the descriptor and float32 matcher
        run: |
          python onnx/check.py --cpu \
            --descriptor "$RUNNER_TEMP/flexglue_onnx"/flexglue_descriptor.onnx \
            --matcher "$RUNNER_TEMP/flexglue_onnx"/flexglue_matcher.onnx

      # Compare the default native schedule and the released schedule.
      - name: Export the float32 matcher with early stopping
        run: |
          python onnx/export.py --matcher_only \
            --early_stop_layers 2,3,4,5,6,7,8 --output_dir "$RUNNER_TEMP/flexglue_onnx"

      - name: Check the float32 matcher with early stopping
        run: |
          python onnx/check.py --cpu \
            --matcher "$RUNNER_TEMP/flexglue_onnx"/flexglue_matcher_early_stop.onnx

      # The early-stopping configuration of the released models, which COLMAP
      # uses.
      - name: Export the float32 matcher with early stopping after layers 2, 4, 6 and 8
        run: |
          python onnx/export.py --matcher_only --early_stop_layers 2,4,6,8 \
            --output_dir "$RUNNER_TEMP/flexglue_onnx_released"

      - name: Check the released early-stopping schedule
        run: |
          python onnx/check.py --cpu --num_keypoints 1,512 \
            --matcher "$RUNNER_TEMP/flexglue_onnx_released/flexglue_matcher_early_stop.onnx"
