name: Format and Lint Checks
on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '.github/workflows/code-quality.yml'
      - 'requirements.txt'
      - 'pyproject.toml'
  pull_request:
    types: [ assigned, opened, synchronize, reopened ]
jobs:
  check:
    name: Format and Lint Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install black==23.12.1 isort==6.0.1 flake8==7.2.0
      - run: python -m black . --check --diff
      - run: python -m isort . --check-only --diff
      - run: python -m flake8 .
  contract-tests:
    name: CPU contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy opencv-python-headless onnx==1.23.2 onnxscript==0.7.2 onnxruntime==1.31.1
      - name: Run maintained CPU contracts
        if: ${{ hashFiles('tests/test_*.py') != '' }}
        run: python -m unittest discover -s tests -v
